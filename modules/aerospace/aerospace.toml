config-version = 2

start-at-login = true

# Keep only workspaces 1 to 10 around.
#
# NOTE: Names are zero-padded ("01".."10" rather than "1".."10") because
# AeroSpaceBar sorts workspace IDs as strings, not numerically.
persistent-workspaces = [
  "01",
  "02",
  "03",
  "04",
  "05",
  "06",
  "07",
  "08",
  "09",
  "10",
]

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Workspace navigation.
cmd-1 = 'workspace 01'
cmd-2 = 'workspace 02'
cmd-3 = 'workspace 03'
cmd-4 = 'workspace 04'
cmd-5 = 'workspace 05'
cmd-6 = 'workspace 06'
cmd-7 = 'workspace 07'
cmd-8 = 'workspace 08'
cmd-9 = 'workspace 09'
cmd-0 = 'workspace 10'

# Move node to workspace.
cmd-shift-1 = 'move-node-to-workspace 01'
cmd-shift-2 = 'move-node-to-workspace 02'
cmd-shift-3 = 'move-node-to-workspace 03'
cmd-shift-4 = 'move-node-to-workspace 04'
cmd-shift-5 = 'move-node-to-workspace 05'
cmd-shift-6 = 'move-node-to-workspace 06'
cmd-shift-7 = 'move-node-to-workspace 07'
cmd-shift-8 = 'move-node-to-workspace 08'
cmd-shift-9 = 'move-node-to-workspace 09'
cmd-shift-0 = 'move-node-to-workspace 10'

# Focuses nearest window in direction.
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'
cmd-left = 'focus left'
cmd-down = 'focus down'
cmd-up = 'focus up'
cmd-right = 'focus right'

# Moves window in direction.
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'
cmd-shift-left = 'move left'
cmd-shift-down = 'move down'
cmd-shift-up = 'move up'
cmd-shift-right = 'move right'

# Window layouts and splitting.
alt-b = 'split horizontal'
alt-v = 'split vertical'
alt-s = 'layout v_accordion'
alt-w = 'layout h_accordion'
alt-e = 'layout tiles horizontal vertical'
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'

# Sway-like scratchpad emulation.
cmd-minus = 'workspace --auto-back-and-forth SP'
cmd-shift-minus = 'move-node-to-workspace SP'

# Window management.
cmd-shift-q = 'close'
cmd-shift-c = 'reload-config'

# Disable native quitting shortcuts globally to prevent accidental application
# quits.
cmd-q = []

# Quick Terminal Launch.
cmd-enter = 'exec-and-forget open -n -a Ghostty'

# Sway-like resize mode trigger.
cmd-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -10'
j = 'resize height +10'
k = 'resize height -10'
l = 'resize width +10'
enter = 'mode main'
esc = 'mode main'

# Map workspaces to specific displays:
#
# NOTE: You can use aerospace list-monitors to get the specific monitor names.
[workspace-to-monitor-force-assignment]
"01" = 'built-in'
"02" = 'built-in'
"03" = 'built-in'

"04" = ['vx3276-qhd', 2, 'built-in']
"05" = ['vx3276-qhd', 2, 'built-in']
"06" = ['vx3276-qhd', 2, 'built-in']
"07" = ['vx3276-qhd', 2, 'built-in']

"08" = ['24g2w1g5', 3, 'built-in']
"09" = ['24g2w1g5', 3, 'built-in']
"10" = ['24g2w1g5', 3, 'built-in']
